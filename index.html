<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner | Mind & Body Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --color-accent: #3b82f6;
            --color-success: #10b981;
            --color-danger: #ef4444;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.dark-mode {
            --bg-primary: #0b0f17;
            --bg-card: #161e2e;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #26334d;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.25s var(--ease-out), color 0.25s var(--ease-out), border-color 0.25s var(--ease-out);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 24px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }

        @media (max-width: 840px) {
            .app-container { grid-template-columns: 1fr; }
        }

        /* Header */
        .app-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 18px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-actions { display: flex; gap: 10px; }

        /* Buttons */
        .btn {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transform: scale(1);
            transition: transform 0.15s var(--ease-out), border-color 0.2s;
        }

        .btn:active { transform: scale(0.96); }
        .btn:hover { border-color: var(--color-accent); }

        .btn-primary {
            background: var(--color-accent);
            color: white;
            border: none;
        }

        .btn-primary:hover { opacity: 0.92; }

        /* Card Container */
        .card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Input Bar */
        .add-task-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .input-text {
            flex: 1;
            min-width: 220px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
        }

        .input-text:focus { border-color: var(--color-accent); }

        .input-time, .input-select {
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            font-weight: 600;
        }

        .mic-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            cursor: pointer;
            font-size: 1rem;
        }

        .mic-btn.recording {
            background: var(--color-danger);
            color: white;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Timeline & Animated Tasks */
        .timeline-container {
            position: relative;
            padding-left: 20px;
        }

        .timeline-line {
            position: absolute;
            left: 85px;
            top: 15px;
            bottom: 15px;
            width: 2px;
            background: var(--border-color);
        }

        .task-row-container {
            position: relative;
            margin-bottom: 16px;
            animation: fadeInTask 0.35s var(--ease-out);
        }

        @keyframes fadeInTask {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .task-time-col {
            width: 70px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: right;
        }

        .task-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--color-accent);
            border: 3px solid var(--bg-card);
            box-shadow: 0 0 0 2px var(--color-accent);
            z-index: 1;
            cursor: pointer;
            transition: transform 0.2s var(--ease-out), background 0.2s;
        }

        .task-node:hover { transform: scale(1.3); }

        .task-row-container.completed .task-node {
            background: var(--color-success);
            box-shadow: 0 0 0 2px var(--color-success);
        }

        .task-card {
            flex: 1;
            background: var(--bg-primary);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s var(--ease-out), border-color 0.2s;
        }

        .task-card:hover {
            transform: translateX(4px);
            border-color: var(--color-accent);
        }

        .task-row-container.completed .task-text {
            text-decoration: line-through;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .task-info { cursor: pointer; flex: 1; }
        .task-text { font-size: 0.95rem; font-weight: 500; line-height: 1.4; }

        .btn-more {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 10px;
            font-size: 1.2rem;
            border-radius: 6px;
        }

        .btn-more:hover { background: var(--border-color); }

        /* Task Edit Panel Slide Down */
        .task-settings-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: var(--radius-md);
            margin-top: 10px;
            margin-left: 100px;
            box-shadow: var(--shadow-sm);
            animation: expandPanel 0.25s var(--ease-out);
        }

        @keyframes expandPanel {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-toggles { display: flex; gap: 6px; flex-wrap: wrap; }

        .day-btn {
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
        }

        .day-btn.active {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        .everyday-btn { width: 100%; margin-bottom: 4px; }

        /* Analytics Sidebar */
        .analytics-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-box {
            position: relative;
            width: 190px;
            height: 190px;
            margin: 12px 0;
        }

        .chart-percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            font-weight: 800;
        }

        .stat-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Smooth Slide-up Overlay Sheets */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            transition: opacity 0.3s var(--ease-out), visibility 0.3s var(--ease-out);
        }

        .sheet-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .sheet-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            padding: 28px;
            overflow-y: auto;
            position: relative;
            transform: translateY(100%);
            transition: transform 0.4s var(--ease-out);
            box-shadow: var(--shadow-md);
        }

        .sheet-overlay.open .sheet-content {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            padding-bottom: 12px;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
        }

        .month-block {
            margin-bottom: 28px;
            scroll-margin-top: 80px;
        }

        .month-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--color-accent);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            padding-bottom: 4px;
        }

        .cal-date {
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }

        .cal-date:hover {
            background: var(--bg-primary);
            transform: scale(1.05);
        }

        .cal-date.active {
            background: var(--color-accent);
            color: white;
        }

        .cal-date.dim {
            opacity: 0.2;
            cursor: default;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 200;
            display: none;
            animation: fadeInTask 0.3s var(--ease-out);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="app-title" id="t_apptitle">Task Planner ⚡</div>
        <div class="header-actions">
            <button class="btn" onclick="toggleCalendar()"><span id="t_viewcalendar">Calendar</span> 📅</button>
            <button class="btn" onclick="toggleSettings()"><span id="t_settings_btn">Settings</span> ⚙️</button>
        </div>
    </header>

    <main>
        <div class="card">
            <h2 class="card-title" id="t_plannertitle">Daily Schedule</h2>
            
            <div class="add-task-form">
                <input type="text" id="taskInput" class="input-text" placeholder="What's on your mind?">
                <input type="number" id="hourInput" class="input-time" min="1" max="12" value="8" style="width: 60px;">
                <input type="number" id="minInput" class="input-time" min="0" max="59" value="00" style="width: 60px;">
                <select id="ampmInput" class="input-select">
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">🎤</button>
                <button class="btn btn-primary" id="t_addtaskbtn" onclick="addNewTask()">Add Task</button>
            </div>

            <div class="timeline-container">
                <div class="timeline-line" id="timelineLine"></div>
                <div id="taskList"></div>
            </div>
        </div>
    </main>

    <aside>
        <div class="card analytics-container">
            <h2 class="card-title" id="t_summarytitle">Daily Summary</h2>
            <div class="chart-box">
                <canvas id="completionChart"></canvas>
                <div class="chart-percent" id="completionPercent">0%</div>
            </div>
            <div id="completionStatus" style="font-weight: 600; margin-bottom: 12px; font-size: 0.95rem;">Tasks in progress</div>
            <div id="statsList" style="width: 100%;"></div>
        </div>
    </aside>
</div>

<!-- Calendar Modal Sheet -->
<div class="sheet-overlay" id="calendarSheet">
    <div class="sheet-content">
        <div class="sheet-header">
            <h3 id="calendarYearTitle">Calendar</h3>
            <button class="btn" onclick="toggleCalendar()">✕</button>
        </div>
        <div id="yearCalendarContainer"></div>
    </div>
</div>

<!-- Settings Sheet -->
<div class="sheet-overlay" id="settingsOverlay">
    <div class="sheet-content">
        <div class="sheet-header">
            <h3 id="t_settings_title">Settings</h3>
            <button class="btn" onclick="toggleSettings()">✕</button>
        </div>
        <div class="setting-item">
            <span id="t_ampm">12-Hour Format</span>
            <input type="checkbox" id="formatToggle" checked onchange="toggleTimeFormat()">
        </div>
        <div class="setting-item">
            <span id="t_darkmode">Dark Mode</span>
            <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
        </div>
        <div class="setting-item">
            <span id="t_themecolor">Theme Color</span>
            <input type="color" id="themeColorPicker" value="#3b82f6" onchange="changeThemeColor(this.value)">
        </div>
        <div class="setting-item">
            <span id="t_language">Language</span>
            <select id="langSelect" class="input-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ru">Русский</option>
                <option value="uz">O'zbekcha</option>
            </select>
        </div>
        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn" onclick="requestOSNotifications()">Enable Notifications 🔔</button>
            <button class="btn" onclick="requestMicPermission()">Grant Microphone Permission 🎤</button>
        </div>
    </div>
</div>

<div class="toast" id="toastBox"></div>

<script>
    let currentLang = localStorage.getItem('planner_lang') || 'en';
    let isDarkMode = localStorage.getItem('planner_dark') === 'true';
    let themeColor = localStorage.getItem('planner_color') || '#3b82f6';
    let is12HourFormat = localStorage.getItem('planner_12h') !== 'false';
    let selectedDateStr = new Date().toISOString().split('T')[0];
    let chartInstance = null;
    let isRecording = false;
    let recognition = null;
    let notifiedTasks = new Set();

    // Default Mind & Body Routine Preloaded
    let storedTasks = localStorage.getItem('planner_tasks');
    let allTasks = storedTasks ? JSON.parse(storedTasks) : [
        { id: 1001, text: "🧘 Posture Reset (Pelvic Tilt Alignment, Cat-Cow & Chin Tucks)", rawHour: 7, rawMin: 0, ampm: "AM", repeatDays: [0,1,2,3,4,5,6], completed: false },
        { id: 1002, text: "🗣️ Active Language Recall & Speaking Practice", rawHour: 7, rawMin: 30, ampm: "AM", repeatDays: [0,1,2,3,4,5,6], completed: false },
        { id: 1003, text: "🧠 Deep Work Block (Focus Zone & Core Tasks)", rawHour: 8, rawMin: 30, ampm: "AM", repeatDays: [1,2,3,4,5], completed: false },
        { id: 1004, text: "💃 Dance Cardio & Body Workout Session", rawHour: 5, rawMin: 0, ampm: "PM", repeatDays: [0,1,2,3,4,5,6], completed: false },
        { id: 1005, text: "♟️ Mental Agility (Chess Logic & Math Puzzles)", rawHour: 8, rawMin: 30, ampm: "PM", repeatDays: [0,1,2,3,4,5,6], completed: false },
        { id: 1006, text: "🌙 Wind Down (Post Stretch, Lofi Music & Smart Band Sync)", rawHour: 10, rawMin: 0, ampm: "PM", repeatDays: [0,1,2,3,4,5,6], completed: false }
    ];

    const i18n = {
        en: {
            apptitle: "Task Planner ⚡",
            settings_title: "Settings",
            settings_btn: "Settings",
            plannertitle: "Daily Schedule",
            addtaskbtn: "Add Task",
            placeholder: "What's on your mind?",
            summarytitle: "Daily Summary",
            viewcalendar: "Calendar",
            ampm: "12-Hour Format",
            darkmode: "Dark Mode",
            themecolor: "Theme Color",
            language: "Language",
            repeatOn: "Repeat on:",
            everyday: "Everyday",
            deleteBtn: "Delete Task",
            planning: "Let's plan your day!",
            allDone: "All done for today! 🎉",
            tasksProgress: "Tasks in progress",
            doneLabel: "Completed",
            pendingLabel: "Pending",
            months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
            days: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
        },
        ru: {
            apptitle: "Планировщик ⚡",
            settings_title: "Настройки",
            settings_btn: "Настройки",
            plannertitle: "Расписание",
            addtaskbtn: "Добавить",
            placeholder: "Что нужно сделать?",
            summarytitle: "Итоги дня",
            viewcalendar: "Календарь",
            ampm: "12-часовой формат",
            darkmode: "Темная тема",
            themecolor: "Цвет темы",
            language: "Язык",
            repeatOn: "Повторять по:",
            everyday: "Каждый день",
            deleteBtn: "Удалить задачу",
            planning: "Спланируйте свой день!",
            allDone: "Всё выполнено! 🎉",
            tasksProgress: "Задачи в процессе",
            doneLabel: "Завершено",
            pendingLabel: "Осталось",
            months: ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],
            days: ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"]
        },
        uz: {
            apptitle: "Topshiriq Rejalashtirgich ⚡",
            settings_title: "Sozlamalar",
            settings_btn: "Sozlamalar",
            plannertitle: "Kunlik Reja",
            addtaskbtn: "Qo'shish",
            placeholder: "Nima rejalashtiryapsiz?",
            summarytitle: "Kunlik Xulosa",
            viewcalendar: "Kaltendar",
            ampm: "12-soatlik format",
            darkmode: "Tungi rejim",
            themecolor: "Mavzu rangi",
            language: "Til",
            repeatOn: "Takrorlash:",
            everyday: "Har kuni",
            deleteBtn: "O'chirish",
            planning: "Kuningizni rejalashtiring!",
            allDone: "Barcha topshiriqlar bajarildi! 🎉",
            tasksProgress: "Jarayondagi topshiriqlar",
            doneLabel: "Bajarildi",
            pendingLabel: "Kutilmoqda",
            months: ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"],
            days: ["Yak","Dush","Sesh","Chorsh","Pay","Juma","Shan"]
        }
    };

    window.onload = () => {
        if (isDarkMode) document.body.classList.add('dark-mode');
        document.getElementById('darkModeToggle').checked = isDarkMode;
        document.getElementById('formatToggle').checked = is12HourFormat;
        document.getElementById('themeColorPicker').value = themeColor;
        document.getElementById('langSelect').value = currentLang;
        changeThemeColor(themeColor, false);
        
        setupChart();
        applyLanguage();
        generateYearCalendar(new Date().getFullYear());
        renderTasks();
        updateAnalytics();
        initSpeechRecognition();
        
        setInterval(checkTaskNotifications, 30000);
    };

    function saveTasks() {
        localStorage.setItem('planner_tasks', JSON.stringify(allTasks));
    }

    function showToast(msg, icon = "ℹ️") {
        const box = document.getElementById('toastBox');
        box.innerHTML = `${icon} ${msg}`;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 3000);
    }

    function getTasksForCurrentDay() {
        const dateObj = new Date(selectedDateStr);
        const dayOfWeek = dateObj.getDay();
        return allTasks.filter(task => {
            if (!task.repeatDays || task.repeatDays.length === 0) return true;
            return task.repeatDays.includes(dayOfWeek);
        });
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        const line = document.getElementById('timelineLine');
        list.innerHTML = '';
        
        const tasks = getTasksForCurrentDay();
        if (tasks.length === 0) {
            line.style.display = 'none';
            return;
        }
        line.style.display = 'block';

        tasks.sort((a,b) => {
            let hA = a.rawHour;
            if (a.ampm === 'PM' && hA < 12) hA += 12;
            if (a.ampm === 'AM' && hA === 12) hA = 0;
            let hB = b.rawHour;
            if (b.ampm === 'PM' && hB < 12) hB += 12;
            if (b.ampm === 'AM' && hB === 12) hB = 0;
            return (hA * 60 + a.rawMin) - (hB * 60 + b.rawMin);
        });

        tasks.forEach(task => {
            const rowContainer = document.createElement('div');
            rowContainer.className = `task-row-container ${task.completed ? 'completed' : ''}`;
            
            let displayTime = '';
            if (is12HourFormat) {
                displayTime = `${String(task.rawHour).padStart(2,'0')}:${String(task.rawMin).padStart(2,'0')} ${task.ampm || ''}`;
            } else {
                let h = task.rawHour;
                if (task.ampm === 'PM' && h < 12) h += 12;
                if (task.ampm === 'AM' && h === 12) h = 0;
                displayTime = `${String(h).padStart(2,'0')}:${String(task.rawMin).padStart(2,'0')}`;
            }

            const isRecurring = task.repeatDays && task.repeatDays.length > 0;

            rowContainer.innerHTML = `
                <div class="task-row">
                    <div class="task-time-col">${displayTime}</div>
                    <div class="task-node" onclick="toggleTaskComplete(${task.id})"></div>
                    <div class="task-card">
                        <div class="task-info" onclick="toggleTaskComplete(${task.id})">
                            <div class="task-text">
                                ${isRecurring ? '<span style="margin-right:6px;">🔁</span>' : ''}
                                ${task.text}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="btn-more" onclick="toggleTaskSettings(${task.id})">•••</button>
                        </div>
                    </div>
                </div>
                <div class="task-settings-panel" id="settings-${task.id}">
                    <span style="font-size:0.8rem; font-weight:700;">${i18n[currentLang].repeatOn}</span>
                    <button class="day-btn everyday-btn" onclick="toggleEveryday(${task.id})">${i18n[currentLang].everyday}</button>
                    <div class="day-toggles">
                        ${i18n[currentLang].days.map((day, idx) => {
                            const active = task.repeatDays && task.repeatDays.includes(idx) ? 'active' : '';
                            return `<button class="day-btn ${active}" onclick="toggleTaskDay(${task.id}, ${idx})">${day}</button>`;
                        }).join('')}
                    </div>
                    <button class="btn" style="border-color:var(--color-danger); color:var(--color-danger); margin-top:6px;" onclick="deleteTask(${task.id})">${i18n[currentLang].deleteBtn}</button>
                </div>
            `;
            list.appendChild(rowContainer);
        });
    }

    function addNewTask() {
        const textInput = document.getElementById('taskInput');
        const text = textInput.value.trim();
        if (!text) return;

        const rawHour = parseInt(document.getElementById('hourInput').value) || 12;
        const rawMin = parseInt(document.getElementById('minInput').value) || 0;
        const ampm = document.getElementById('ampmInput').value;

        const newTask = {
            id: Date.now(),
            text: text,
            rawHour: rawHour,
            rawMin: rawMin,
            ampm: ampm,
            repeatDays: [],
            completed: false
        };

        allTasks.push(newTask);
        saveTasks();
        textInput.value = '';
        renderTasks();
        updateAnalytics();
    }

    function toggleTaskComplete(id) {
        const task = allTasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            saveTasks();
            renderTasks();
            updateAnalytics();
        }
    }

    function deleteTask(id) {
        allTasks = allTasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
        updateAnalytics();
    }

    function toggleTaskSettings(id) {
        const panel = document.getElementById(`settings-${id}`);
        if (panel) {
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }
    }

    function toggleTaskDay(id, dayIdx) {
        const task = allTasks.find(t => t.id === id);
        if (task) {
            if (!task.repeatDays) task.repeatDays = [];
            const index = task.repeatDays.indexOf(dayIdx);
            if (index > -1) task.repeatDays.splice(index, 1);
            else task.repeatDays.push(dayIdx);
            saveTasks();
            renderTasks();
        }
    }

    function toggleEveryday(id) {
        const task = allTasks.find(t => t.id === id);
        if (task) {
            if (!task.repeatDays) task.repeatDays = [];
            task.repeatDays = task.repeatDays.length === 7 ? [] : [0, 1, 2, 3, 4, 5, 6];
            saveTasks();
            renderTasks();
        }
    }

    function setupChart() {
        const ctx = document.getElementById('completionChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [0, 100],
                    backgroundColor: [themeColor, '#e2e8f0'],
                    borderWidth: 0
                }]
            },
            options: {
                cutout: '80%',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });
    }

    function updateAnalytics() {
        const tasks = getTasksForCurrentDay();
        const completed = tasks.filter(t => t.completed).length;
        const total = tasks.length;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

        document.getElementById('completionPercent').innerText = `${percent}%`;
        
        const statusEl = document.getElementById('completionStatus');
        if (total === 0) statusEl.innerText = i18n[currentLang].planning;
        else if (percent === 100) statusEl.innerText = i18n[currentLang].allDone;
        else statusEl.innerText = i18n[currentLang].tasksProgress;

        if (chartInstance) {
            chartInstance.data.datasets[0].data = [percent, total === 0 ? 100 : 100 - percent];
            chartInstance.data.datasets[0].backgroundColor[0] = themeColor;
            chartInstance.update();
        }

        const statsList = document.getElementById('statsList');
        statsList.innerHTML = `
            <div class="stat-row"><span>${i18n[currentLang].doneLabel}</span><span style="color:var(--color-success); font-weight:700;">${completed}</span></div>
            <div class="stat-row"><span>${i18n[currentLang].pendingLabel}</span><span style="color:var(--color-accent); font-weight:700;">${total - completed}</span></div>
        `;
    }

    /* Modern Calendar Auto-scroll to Current Month */
    function toggleCalendar() {
        const sheet = document.getElementById('calendarSheet');
        const isOpen = sheet.classList.contains('open');

        if (!isOpen) {
            sheet.classList.add('open');
            const currentMonthIndex = new Date().getMonth();
            const monthBlocks = document.querySelectorAll('.month-block');
            
            if (monthBlocks && monthBlocks[currentMonthIndex]) {
                setTimeout(() => {
                    monthBlocks[currentMonthIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);
            }
        } else {
            sheet.classList.remove('open');
        }
    }

    function generateYearCalendar(year) {
        const container = document.getElementById('yearCalendarContainer');
        container.innerHTML = '';
        const langData = i18n[currentLang];
        document.getElementById('calendarYearTitle').innerText = `${year} Calendar`;

        for (let m = 0; m < 12; m++) {
            const monthBlock = document.createElement('div');
            monthBlock.className = 'month-block';
            
            const title = document.createElement('div');
            title.className = 'month-title';
            title.innerText = langData.months[m];
            monthBlock.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';

            langData.days.forEach(day => {
                const dName = document.createElement('div');
                dName.className = 'cal-day-name';
                dName.innerText = day;
                grid.appendChild(dName);
            });

            const firstDay = new Date(year, m, 1).getDay();
            const daysInMonth = new Date(year, m + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-date dim';
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateEl = document.createElement('div');
                dateEl.className = 'cal-date';
                dateEl.innerText = d;
                
                const currentStr = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                if (currentStr === selectedDateStr) dateEl.classList.add('active');

                dateEl.onclick = () => {
                    selectedDateStr = currentStr;
                    document.querySelectorAll('.cal-date').forEach(el => el.classList.remove('active'));
                    dateEl.classList.add('active');
                    renderTasks();
                    updateAnalytics();
                    toggleCalendar();
                };

                grid.appendChild(dateEl);
            }

            monthBlock.appendChild(grid);
            container.appendChild(monthBlock);
        }
    }

    function toggleSettings() {
        document.getElementById('settingsOverlay').classList.toggle('open');
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('planner_dark', isDarkMode);
    }

    function toggleTimeFormat() {
        is12HourFormat = !is12HourFormat;
        localStorage.setItem('planner_12h', is12HourFormat);
        renderTasks();
    }

    function changeThemeColor(color, save = true) {
        themeColor = color;
        document.documentElement.style.setProperty('--color-accent', color);
        if (save) localStorage.setItem('planner_color', color);
        updateAnalytics();
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('planner_lang', lang);
        applyLanguage();
        generateYearCalendar(new Date().getFullYear());
        renderTasks();
        updateAnalytics();
    }

    function applyLanguage() {
        const langData = i18n[currentLang];
        document.getElementById('t_apptitle').innerHTML = langData.apptitle;
        document.getElementById('t_settings_title').innerText = langData.settings_title;
        document.getElementById('t_settings_btn').innerText = langData.settings_btn;
        document.getElementById('t_plannertitle').innerText = langData.plannertitle;
        document.getElementById('t_addtaskbtn').innerText = langData.addtaskbtn;
        document.getElementById('taskInput').placeholder = langData.placeholder;
        document.getElementById('t_summarytitle').innerText = langData.summarytitle;
        document.getElementById('t_viewcalendar').innerText = langData.viewcalendar;
        document.getElementById('t_ampm').innerText = langData.ampm;
        document.getElementById('t_darkmode').innerText = langData.darkmode;
        document.getElementById('t_themecolor').innerText = langData.themecolor;
        document.getElementById('t_language').innerText = langData.language;
    }

    function initSpeechRecognition() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('taskInput').value = transcript;
                toggleVoiceInput(true);
            };

            recognition.onerror = () => toggleVoiceInput(true);
            recognition.onend = () => toggleVoiceInput(true);
        } else {
            document.getElementById('micBtn').style.display = 'none';
        }
    }

    function toggleVoiceInput(forceStop = false) {
        if (!recognition) return;
        const btn = document.getElementById('micBtn');
        if (isRecording || forceStop) {
            recognition.stop();
            isRecording = false;
            btn.classList.remove('recording');
        } else {
            try {
                recognition.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch(e) { console.error(e); }
        }
    }

    function requestOSNotifications() {
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                if(permission === 'granted') showToast("Notifications enabled!", "🔔");
            });
        }
    }

    function requestMicPermission() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(() => showToast("Microphone permission granted!", "🎤"))
                .catch(() => showToast("Microphone permission denied.", "❌"));
        }
    }

    function checkTaskNotifications() {
        if (Notification.permission !== 'granted') return;
        const now = new Date();
        const curH = now.getHours();
        const curM = now.getMinutes();

        allTasks.forEach(task => {
            let h = task.rawHour;
            if (task.ampm === 'PM' && h < 12) h += 12;
            if (task.ampm === 'AM' && h === 12) h = 0;

            if (h === curH && task.rawMin === curM && !task.completed && !notifiedTasks.has(task.id)) {
                new Notification("Task Reminder ⏰", { body: task.text });
                notifiedTasks.add(task.id);
            }
        });
    }
</script>
</body>
